<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<div class="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">Search Movie</label>
            <input type="text" class="form-control" id="searchMovie" name="searchMovie">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Searching for {{ searchTerm }}</p>
   <!-- Un card por cada película con sus correspondientes atributos -->
<div class="row row-cols-1 row-cols-md-3 g-4">
 <!-- define una fila en una cuadrícula con una columna en pantallas extra pequeñas y tres
columnas en pantallas grandes-->
{% for movie in movies %}
<div v-for="movie in movies" class="col">
<div class="card">
<img src="{{ movie.image.url }}" class="card-img-top" alt="...">
<div class="card-body">
<h5 class="card-title">{{ movie.title }}</h5>
<p class="card-text">{{ movie.description }}</p>
{% if movie.url %}
<a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
{% endif %}

{% if movie.genre %}
<p>{{ movie.genre }}</p>
{% endif %}

{% if movie.year %}
<p>{{ movie.year }}</p>
{% endif %}
</div>
</div>
</div>
{% endfor %}
</div>
</div>
